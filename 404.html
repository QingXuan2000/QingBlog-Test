<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark">
    <title>404 - 页面未找到</title>

    <meta name="description" content="页面未找到" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/font-awesome.min.css" />

    <style>
        @keyframes errorPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.04);
                opacity: 0.85;
            }
        }

        .error-page {
            display: grid;
            place-content: center;
            height: calc(100vh - (var(--nav-height) * 2));
        }

        .error-card {
            text-align: center;
            min-width: 50vw;
            padding: 3rem;
            background: var(--surface-color);
            backdrop-filter: var(--backdrop-blur);
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--box-shadow-color) 0 4px 20px 0px;
        }

        .error-code {
            font-family: "江城圆体";
            font-size: 10rem;
            font-weight: bold;
            line-height: 1;
            color: var(--primary-color);
            text-shadow: 0 4px 12px var(--box-shadow-color);
            margin-bottom: 0.5rem;
            animation: errorPulse 2s ease-in-out infinite;
        }

        .error-icon {
            font-size: 3rem;
            color: var(--text-secondary-color);
            margin-bottom: 1rem;
        }

        .error-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.8rem;
        }

        .error-card p {
            font-size: 1rem;
            color: var(--text-secondary-color);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 2rem;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            background: var(--surface-color);
            backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            box-shadow: var(--box-shadow-color) 0 4px 12px 0px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .error-btn-secondary:hover {
            color: var(--text-color);
            transform: translateY(-2px);
        }

        .error-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 3px 6px var(--box-shadow-color);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

</head>

<body>
    <main class="error-page">
        <div class="error-card">
            <div class="error-icon">
                <i class="fa fa-map-signs"></i>
            </div>

            <div class="error-code">404</div>

            <h2>页面未找到</h2>
            <p>抱歉，您访问的页面不存在或已被移除。<br>请检查链接是否正确，或返回首页。</p>

            <div class="error-actions">
                <a href="#" onclick="window.qingBlogInstance.navigation('/')" class="error-btn error-btn-secondary">
                    <i class="fa fa-home"></i>
                    返回首页
                </a>
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">
                    <i class="fa fa-arrow-left"></i>
                    返回上页
                </a>
            </div>

        </div>
    </main>

    <script>
        // 404 页仅需要最小跳转能力：保持“返回首页”可用且不依赖外部 JS 文件
        (() => {
            const parts = window.location.pathname.split("/").filter(Boolean);
            const first = parts[0] || "";
            const looksLikeFile = first.includes(".");
            const siteBase = looksLikeFile ? "/" : `/${first}/`;

            window.qingBlogInstance = {
                navigation(href) {
                    const target = (href || "/").replace(/^\//, "");
                    const baseUrl = siteBase + target;
                    const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "skipLoading=true";
                    window.location.href = url;
                }
            };
        })();
    </script>
</body>

</html>
